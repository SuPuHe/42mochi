<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>42Mochi - {{ displayname | default('Guest') }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/game.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --coalition-color: {{ coalition_color | default('#6abc3a') }};
            --coalition-color-dark: {{ coalition_color_dark | default('#55992c') }};
            --coalition-color-light: {{ coalition_color_light | default('#9ed866') }};
        }
    </style>
</head>
<body class="bg-secondary" data-coalition="{{ coalition | default('None') }}">
    <nav class="navbar">
        <div class="nav-buttons">
            <button onclick="window.location.href='/home'">42Mochi</button>
            <button onclick="window.location.href='/teamup'">TeamUp</button>
            <button class="active" onclick="window.location.href='/friends'">Friends</button>
        </div>
    </nav>

    <main class="game-container">
        <div class="left-side">
            <div class="ep-counter"></div>
        </div>

        <div class="center-content">
            <div class="intraname">{{ displayname | default('Guest') }}</div>
            <div class="coalition-badge" style="background-color: var(--coalition-color);">
                {{ coalition | default('No Coalition') }}
            </div>
            <div class="character-section">
                <canvas id="characterCanvas" width="256" height="256" data-sprite-type="{{ sprite_type | default('green') }}"></canvas>
                <div class="hp-container">
                    <div class="hp-text">HP: {{ monster_hp | default(100) }}%</div>
                    <div class="days-container">
                        <div class="days-text">Days Alive: {{ days | default(0) }}</div>
                    </div>
                    <div class="coins">
                        <div class="lvl-text">COINS: </div>
                        <span class="coin-icon">🪙</span>
                        <span class="coin-amount">{{ total_coins | default(100) }}</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="right-side">
            <button onclick="toggleModal('store')">Store</button>
            <button onclick="toggleModal('inventory')">Inventory</button>
        </div>

        <!-- Store Modal -->
        <div id="store-modal" class="modal hidden">
            <div class="modal-content">
                <button class="modal-close" onclick="toggleModal('store')">&times;</button>
                <h2>Store</h2>
                <div class="store-tabs">
                    <button class="tab-button active" onclick="openTab('store-food')">Food</button>
                    <button class="tab-button" onclick="openTab('store-clothes')">Clothes</button>
                </div>
                <div id="store-food" class="tab-content active">
                    <div class="store-item" data-item="int_food" data-price="5">
                        <span class="item-icon">🥣</span>
                        <span class="item-name" title="A soup that causes integer overflow. Caution: May exceed 2,147,483,647 calories!">Int Soup</span>
                        <button class="buy-button">5 💰</button>
                    </div>
                    <div class="store-item" data-item="char_food" data-price="3">
                        <span class="item-icon">🍪</span>
                        <span class="item-name" title="Binary chocolate chips (01001000) baked in.">Char Cookies</span>
                        <button class="buy-button">3 💰</button>
                    </div>
                </div>
                <div id="store-clothes" class="tab-content">
                    <p>Clothes items will be listed here.</p>
                </div>
            </div>
        </div>

        <!-- Inventory Modal -->
        <div id="inventory-modal" class="modal hidden">
            <div class="modal-content">
                <button class="modal-close" onclick="toggleModal('inventory')">&times;</button>
                <h2>Inventory</h2>
                <div class="inventory-grid">
                    <!-- Inventory items will be dynamically added here -->
                </div>
            </div>
        </div>
    </main>
    <script src="/static/js/character.js"></script>
    <script src="/static/js/healthbar.js"></script>
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/mochi-state.js"></script>
</body>
</html>
